# Scans for committed secrets with gitleaks (MIT; pinned by version and SHA-256 in install-tools;
# always its default rules) and for private data with the privacy rules of this repository's
# packs: the commits of each pull request and each push to main, and the whole history every
# Monday and when run by hand. Positive controls run first. Findings are redacted. The same file
# in every repository of the standard; never edit it here.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: .github/standard/bin/install-tools gitleaks
      - name: Positive controls, accepted findings, then the new commits or the whole history
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/standard/bin/secret-scan
