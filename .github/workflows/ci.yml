# Runs the pytest suite on Linux on every push and pull request, including the
# POSIX-only tests the Windows dev box skips. Pull requests and main also build
# and smoke-test the image for amd64 and arm64 (image.yml, without pushing).
# Actions are pinned to commit SHAs; Dependabot proposes updates.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  # Pushes to other branches run pytest only, so a pull request builds the
  # image once. permissions is set on this job because a called workflow gets
  # the default token permissions unless its calling job sets them.
  image:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/image.yml
