# The container image of the image kind: the same file in every repository of the
# release profile (.github/standard/MANIFEST); change it in repo-standard, never here. ci.yml calls
# it with push false: it builds and loads each platform of IMAGE_PLATFORMS with the build argument
# VERSION and runs ci/image-smoke on each. release.yml calls it with push true and the version: it
# then also pushes one multi-platform index, untagged and by digest only, with provenance and an
# SBOM and no cache, and uploads image.json, SHA256SUMS and notes.md as the release artifact.
# BuildKit and the QEMU binfmt image are pinned by digest. The image is ghcr.io/ and the repository
# in lower case, worked out at run time, so the file names no owner.
name: image

on:
  workflow_call:
    inputs:
      push:
        description: Push the image by digest and upload the release artifact.
        type: boolean
        required: true
      version:
        description: The version to build; empty for the VERSION file.
        type: string
        default: ''
    outputs:
      digest:
        description: The digest of the pushed index; empty without push.
        value: ${{ jobs.build.outputs.digest }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: conf
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          platforms=$(.github/standard/bin/conf --get IMAGE_PLATFORMS | tr ' ' ',')
          version=${INPUT_VERSION:-$(tr -d '\r' < VERSION)}
          printf 'platforms=%s\nversion=%s\n' "$platforms" "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Build, load and smoke-test each platform
        env:
          PLATFORMS: ${{ steps.conf.outputs.platforms }}
          VERSION: ${{ steps.conf.outputs.version }}
        run: |
          IFS=, read -r -a platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            ref=image-smoke:${platform//\//-}
            docker buildx build --platform "$platform" --build-arg "VERSION=$VERSION" \
              --provenance=false --sbom=false --load --tag "$ref" .
            ci/image-smoke "$ref" "$platform"
          done
      - id: labels
        name: The image name and its OCI labels
        if: inputs.push
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ steps.conf.outputs.version }}
        run: |
          {
            printf 'name=ghcr.io/%s\n' "${REPOSITORY,,}"
            printf 'labels<<LABELS\n'
            printf 'org.opencontainers.image.source=%s/%s\n' "$SERVER" "$REPOSITORY"
            printf 'org.opencontainers.image.revision=%s\n' "$COMMIT"
            printf 'org.opencontainers.image.version=%s\n' "$VERSION"
            printf 'LABELS\n'
          } >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io with the job token on stdin
        if: inputs.push
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ steps.conf.outputs.platforms }}
          build-args: VERSION=${{ steps.conf.outputs.version }}
          labels: ${{ steps.labels.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ steps.labels.outputs.name }},push-by-digest=true,name-canonical=true,push=true
      - name: image.json, SHA256SUMS and notes.md
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: .github/standard/bin/release-build --image --digest "$DIGEST" --out release-build
      - if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release-build/
          if-no-files-found: error
          retention-days: 5
