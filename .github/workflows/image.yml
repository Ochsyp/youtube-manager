# Reusable: builds the image for amd64 and arm64, smoke-tests each with
# scripts/smoke-test-image.sh, and with `push` publishes both to ghcr.io as one
# image with provenance and SBOM attestations. Called by ci.yml and release.yml.
# Actions are pinned to commit SHAs; Dependabot proposes updates.
name: image

on:
  workflow_call:
    inputs:
      push:
        description: Push both platforms to ghcr.io once their smoke tests pass
        type: boolean
        default: false
      version:
        description: The release, such as 1.2.3; the image tag and YTM_VERSION
        type: string
        default: dev
      latest:
        description: Also tag the pushed image latest
        type: boolean
        default: false
    outputs:
      digest:
        description: The pushed image index digest, sha256:...; empty without push
        value: ${{ jobs.build.outputs.digest }}

# No permissions key: a called workflow runs with its calling job's token, and
# asking for more than that job grants fails the call.
jobs:
  build:
    runs-on: ubuntu-24.04
    # Generous, because the arm64 build and smoke test run under QEMU.
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registers QEMU for arm64 with the kernel, from a binfmt image pinned by
      # digest. Dependabot does not read this input, so the pin moves by hand.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Each platform is built alone and loaded into the runner's Docker for its
      # smoke test. provenance: false, as the local image store cannot hold
      # attestations. A failed cache export only slows the next run, so
      # ignore-error keeps it from failing the build. A release skips the
      # cache, so its image gets the Debian packages of the day it is built.
      - name: Build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ytm-smoke:amd64
          provenance: false
          build-args: YTM_VERSION=${{ inputs.version }}
          no-cache: ${{ inputs.push }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,ignore-error=true

      - name: Smoke-test linux/amd64
        timeout-minutes: 15
        run: bash scripts/smoke-test-image.sh ytm-smoke:amd64 linux/amd64

      # The same for arm64, which runs under QEMU and is many times slower.
      - name: Build linux/arm64
        timeout-minutes: 60
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ytm-smoke:arm64
          provenance: false
          build-args: YTM_VERSION=${{ inputs.version }}
          no-cache: ${{ inputs.push }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,ignore-error=true

      - name: Smoke-test linux/arm64
        timeout-minutes: 30
        env:
          SMOKE_TIMEOUT: "600"
        run: bash scripts/smoke-test-image.sh ytm-smoke:arm64 linux/arm64

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag, plus latest only when the caller asks for it;
      # latest=false leaves the latest tag entirely to that second entry.
      - name: Image tags and labels
        id: meta
        if: inputs.push
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ochsyp/youtube-manager
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      # Both platforms as one image index, from the layers the builds above
      # left in the builder, so nothing is rebuilt and the smoke-tested layers
      # are the ones pushed.
      - name: Push linux/amd64 and linux/arm64
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: YTM_VERSION=${{ inputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Record the image reference
        if: inputs.push
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="ghcr.io/ochsyp/youtube-manager:${VERSION}@${DIGEST}"
          echo "Pushed $ref"
          {
            echo '### Container image'
            echo
            echo '```'
            echo "$ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
