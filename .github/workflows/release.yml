# Releases of the repository standard (spec 3.5): the same file in every repository of the release
# profile (.github/standard/MANIFEST); change it in repo-standard, never here. A merged release
# pull request changes VERSION on main: meta checks that the release is pending, checks runs ci.yml
# on that commit, build (zip, tar, stack) or build-image (image) builds it, attest attests it in a
# public repository, and draft drafts the release, which the owner publishes in the browser.
# Publishing or editing a release runs promote (the image kind's tags) and verify, which changes
# nothing. A pull request that touches the release files gets a dry run that builds twice and
# compares. A dispatch on main drafts a pending release again or repairs the image tags; with
# rehearse, it rehearses the image path on any branch and drafts nothing.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      rehearse:
        description: Image kind only. Build, push by digest, attest, tag "rehearsal"; no draft.
        type: boolean
        default: false
  pull_request:
    paths:
      - VERSION
      - .gitattributes
      - .github/standard.conf
      - .github/workflows/release.yml
      - .github/workflows/image.yml
      - '.github/standard/bin/release-*'
      - 'ci/release-*'
  release:
    types: [published, edited]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-dry-run-{0}', github.ref) || github.event_name == 'release' && format('release-published-{0}', github.run_id) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  meta:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.conf.outputs.kind }}
      runner: ${{ steps.conf.outputs.release-runner }}
      public: ${{ steps.conf.outputs.public }}
      rehearse: ${{ steps.conf.outputs.rehearse }}
      version: ${{ steps.meta.outputs.version }}
      state: ${{ steps.meta.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: conf
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
          PRIVATE: ${{ github.event.repository.private }}
          REHEARSE: ${{ inputs.rehearse }}
        run: .github/standard/bin/conf --ci >> "$GITHUB_OUTPUT"
      - id: meta
        name: VERSION, CHANGELOG.md and the release tags
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          args=(--event "$EVENT")
          [[ $EVENT != release ]] || args+=(--release "$TAG")
          git tag --list 'v*' | .github/standard/bin/release-meta check "${args[@]}" >> "$GITHUB_OUTPUT"

  dry-run:
    needs: meta
    if: github.event_name == 'pull_request' && contains(fromJSON('["zip", "tar", "stack"]'), needs.meta.outputs.kind)
    runs-on: ${{ needs.meta.outputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build twice and compare every file
        run: .github/standard/bin/release-build --dry-run --out "$RUNNER_TEMP/release-build"

  checks:
    needs: meta
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'release' &&
      github.ref == 'refs/heads/main' && needs.meta.outputs.state == 'pending' &&
      needs.meta.outputs.rehearse != 'true'
    permissions:
      contents: read
      pull-requests: read     # the called standard job asks for it, and a call may not grant less
    uses: ./.github/workflows/ci.yml

  build:
    needs: [meta, checks]
    if: contains(fromJSON('["zip", "tar", "stack"]'), needs.meta.outputs.kind)
    runs-on: ${{ needs.meta.outputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the release of main
        run: .github/standard/bin/release-build --out release-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release-build/
          if-no-files-found: error
          retention-days: 5

  build-image:
    needs: [meta, checks]
    if: >-
      !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.kind == 'image' &&
      (needs.checks.result == 'success' || needs.meta.outputs.rehearse == 'true')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: true
      version: ${{ needs.meta.outputs.version }}

  attest:
    needs: [meta, build, build-image]
    if: >-
      !cancelled() && needs.meta.outputs.public == 'true' &&
      (needs.build.result == 'success' || needs.build-image.result == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release-build
      - id: image
        name: The image and digest that image.json names
        if: needs.meta.outputs.kind == 'image'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          digest=$(sed -n 's/^  "digest": "\(sha256:[0-9a-f]\{64\}\)",$/\1/p' release-build/assets/image.json)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::image.json names no digest"; exit 1; }
          printf 'name=ghcr.io/%s\ndigest=%s\n' "${REPOSITORY,,}" "$digest" >> "$GITHUB_OUTPUT"
      - if: needs.meta.outputs.kind != 'image'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-build/assets/*
      - if: needs.meta.outputs.kind == 'image'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: false

  draft:
    needs: [meta, build, build-image, attest]
    if: >-
      !cancelled() && needs.meta.outputs.rehearse != 'true' &&
      (needs.build.result == 'success' || needs.build-image.result == 'success') &&
      contains(fromJSON('["success", "skipped"]'), needs.attest.result)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/standard/bin
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release-build
      - name: Draft the release for the owner to publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: .github/standard/bin/release-draft --dir release-build

  promote:
    needs: [meta, build-image]
    if: >-
      !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.kind == 'image' &&
      (github.event_name == 'release' ||
      (needs.meta.outputs.rehearse == 'true' && needs.build-image.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.meta.outputs.state == 'released'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/standard/bin
          sparse-checkout-cone-mode: true
      - if: needs.meta.outputs.rehearse == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release-build
      - name: Tag the digest of the release, or of the rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REHEARSE: ${{ needs.meta.outputs.rehearse }}
          TAG: ${{ github.event.release.tag_name || format('v{0}', needs.meta.outputs.version) }}
        run: |
          if [[ $REHEARSE == true ]]; then
            .github/standard/bin/release-promote --rehearse --dir release-build/assets
          else
            .github/standard/bin/release-promote --tag "$TAG"
          fi

  verify:
    needs: [meta, promote]
    if: >-
      !cancelled() && github.event_name == 'release' && needs.meta.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.promote.result)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/standard/bin
            .githooks
            ci
          sparse-checkout-cone-mode: true
      - name: Check the published release, read-only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          PUBLIC: ${{ needs.meta.outputs.public }}
        run: |
          args=(--tag "$TAG")
          [[ $PUBLIC != true ]] || args+=(--public)
          .github/standard/bin/release-verify "${args[@]}"
