# .github/standard.conf of this repository: data for .github/standard/bin/conf, which alone
# reads it (the repository standard, section 2.4). Set NAME, VISIBILITY and RELEASE_KIND; each
# commented KEY= line shows its default, or an example. tools/sync --init needs this file.
NAME=youtube-manager
VISIBILITY=public
# ROLE=consumer
LICENSE=MIT
CI_RUNNER=ubuntu
CI_STAGES=test
# CI_WEEKLY=no
PYTHON=3.13
# PS_MODULES=pester psscriptanalyzer
IMAGE_PLATFORMS=linux/amd64 linux/arm64
# legacy keeps this repository's own release.yml and image.yml until its release adoption.
RELEASE_KIND=image
# RELEASE_RUNNER=ubuntu
# RELEASE_MANIFEST=example-release.json
# RELEASE_ASSETS=example-release.json
# VERSION_COPY=src/version.txt|version = X.Y.Z
# release-prepare writes the README's install command, and standard-check fails until it matches.
VERSION_COPY=README.md|echo 'YTM_VERSION=X.Y.Z' > .env
# yes only where hosts install sealed releases only; never with RELEASE_KIND=legacy.
SEAL=yes
PRIVACY_RULES=base
# Exemptions and accepted findings come in a chore/privacy-* pull request of their own.
# PRIVACY_ALLOW is KIND PATH-ERE VALUE-ERE and holds for history scans too. The path ERE starts
# with ^, and the value ERE is anchored with ^ and $. A path of ^$ matches only what is in no file:
# messages, pull request texts, ref names, commit and tag objects, identities.
# Before you commit this file, run sh .github/standard/bin/conf --check: in a version that does
# not parse, these values become lasting history hits.
# PRIVACY_ALLOW=ipv4 ^tests/ ^192\.0\.2\.[0-9]+$
# Two made-up placeholder values, confirmed by the maintainer on 2026-11-25: the example UI
# host name in the README and the tests, and the user part of a test URL the app must refuse.
PRIVACY_ALLOW=host-name ^(README\.md|tests/conftest\.py)$ ^ytdl\.home\.arpa$
PRIVACY_ALLOW=e-mail ^tests/test_organizer_moves\.py$ ^user@i\.ytimg\.com$
# PRIVACY_HISTORY_ACCEPT=0123456789abcdef0123456789abcdef01234567 ipv4
# Raise this at adoption only if a tracked file is above it. The hooks read it from HEAD, so the
# raise goes in first, in a commit of its own, and in a chore/privacy-* pull request once this
# file is on main.
# MAX_BLOB_KB=1024
