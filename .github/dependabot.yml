# standard:begin dependabot
# Dependabot. The workflows here are copies from the repository standard, so their actions move
# only with a standard release: the github-actions entry below opens no version updates
# (open-pull-requests-limit: 0), and repo-standard takes them.
# Every other entry is this repository's own. It is grouped, so it has at most one pull request
# open, and commits as chore(deps), or as ci for what only CI uses. Its cooldown is at least 7 days;
# security updates skip it, and an image the owner publishes may be excluded, since the owner's
# publish is its gate.
version: 2
updates:
# standard:end dependabot
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # requirements.txt pins every runtime dependency exactly, so their updates
  # arrive as pull requests rather than only as security alerts.
  # uv rather than pip: it recompiles requirements.txt with the uv command in
  # its header, for every platform and Python 3.13, and also updates the pins
  # in requirements-dev.txt. Checked daily, with each release held back seven
  # days so a broken or compromised one is usually withdrawn first. yt-dlp,
  # its JavaScript solver and its PO-token plugin skip the wait: their
  # releases follow YouTube's changes.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # Every pin, not only the direct dependencies in requirements.in, so the
    # pins they pull in, certifi's CA bundle among them, stay current too.
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
      exclude: [yt-dlp, yt-dlp-ejs, bgutil-ytdlp-pot-provider]
    commit-message:
      prefix: "chore(deps)"
    groups:
      yt-dlp:
        patterns: [yt-dlp, yt-dlp-ejs, bgutil-ytdlp-pot-provider]
      python:
        patterns: ["*"]
        exclude-patterns: [yt-dlp, yt-dlp-ejs, bgutil-ytdlp-pot-provider]
    # compose.example.yaml runs the provider server at the plugin's release,
    # and tests/test_build.py fails until a plugin update moves it as well. A
    # new major, which every host's server has to follow, moves by hand.
    ignore:
      - dependency-name: bgutil-ytdlp-pot-provider
        update-types: ["version-update:semver-major"]

  # Digest updates still arrive. A Python minor upgrade is a deliberate change
  # of CI, the tests and the image together, so newer python tags are ignored.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: python
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
