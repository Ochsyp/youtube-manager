# Example deployment: the web UI and the worker from one image built from this
# checkout, plus the bgutil PO-token provider. Set the host paths and
# YTM_ALLOWED_HOSTS, then run `docker compose -f compose.example.yaml up -d --build`.
# README.md lists every variable under Configuration and explains these choices.
name: youtube-manager

services:
  # Keep this service name: the app answers to it, for probes on this network.
  youtube-manager:
    build: .
    # Both services name the same image, so Compose builds it only once.
    image: youtube-manager:local
    restart: unless-stopped
    # Reaps the child processes the app starts, which a Python PID 1 does not.
    init: true
    environment:
      PUID: "1000"
      PGID: "1000"
      MEDIA_PATH: /media
      DOWNLOAD_PATH: /downloads
      # The name the reverse proxy serves the UI under.
      YTM_ALLOWED_HOSTS: ytdl.example.test
    volumes:
      - ./data:/app/data
      - ./library:/media
      - ./staging:/downloads
    # Loopback only, for a reverse proxy on this host. Drop it when the proxy
    # reaches the container over a Docker network instead.
    ports:
      - 127.0.0.1:8080:8080
    # --noproxy keeps the check off any HTTP_PROXY; /health never touches SQLite.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--noproxy", "*", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  youtube-worker:
    build: .
    image: youtube-manager:local
    command: ["python", "worker.py"]
    restart: unless-stopped
    init: true
    # Docker's default of 10 s can kill a step mid-write after SIGTERM.
    stop_grace_period: 60s
    environment:
      PUID: "1000"
      PGID: "1000"
      MEDIA_PATH: /media
      DOWNLOAD_PATH: /downloads
      POT_PROVIDER_URL: http://bgutil-provider:4416
      # Optional: ask Jellyfin to rescan after filing.
      # JELLYFIN_URL: https://jellyfin.example.test:8920
      # JELLYFIN_TOKEN: <API key>
      # Optional: a marker file on the library disk; nothing is filed while it
      # is missing. Create the file before setting this.
      # LIBRARY_SENTINEL: /media/.library-mounted
    volumes:
      - ./data:/app/data
      - ./library:/media
      - ./staging:/downloads
    # The heartbeat and yt-dlp's path reports live in /tmp, kept off the disk.
    tmpfs:
      - /tmp
    # The worker serves no HTTP, so this checks the age of its heartbeat file.
    # 600 s clears the longest gap between touches.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 600 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      - bgutil-provider

  # Mints the PO tokens YouTube requires for its full format list. Keep its
  # release in step with the bgutil-ytdlp-pot-provider plugin in the image.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
