# Example deployment, explained in README.md: the web UI and the worker from the
# published image, plus the bgutil PO-token provider. Set YTM_VERSION (with the
# release's digest in production) in .env beside this file, the host paths and
# YTM_ALLOWED_HOSTS, then run `docker compose -f compose.example.yaml up -d`.
name: youtube-manager

services:
  # Keep this service name: the app answers to it, for probes on this network.
  youtube-manager:
    # YTM_VERSION is a release, such as 1.0.0, or a release with its digest:
    # 1.0.0@sha256:<digest>. The image runs tini as PID 1, so neither service
    # needs init: true.
    image: ghcr.io/ochsyp/youtube-manager:${YTM_VERSION:?set YTM_VERSION to a release, such as 1.0.0}
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      MEDIA_PATH: /media
      DOWNLOAD_PATH: /downloads
      # The name the reverse proxy serves the UI under.
      YTM_ALLOWED_HOSTS: ytdl.example.test
    volumes:
      - ./data:/app/data
      - ./library:/media
      - ./staging:/downloads
    # Loopback only, for a reverse proxy on this host. Drop it when the proxy
    # reaches the container over a Docker network instead.
    ports:
      - 127.0.0.1:8080:8080
    # --noproxy keeps the check off any HTTP_PROXY; /health never touches SQLite.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--noproxy", "*", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  youtube-worker:
    image: ghcr.io/ochsyp/youtube-manager:${YTM_VERSION:?set YTM_VERSION to a release, such as 1.0.0}
    command: ["worker"]
    restart: unless-stopped
    # Docker's default of 10 s can kill a step mid-write after SIGTERM.
    stop_grace_period: 60s
    environment:
      PUID: "1000"
      PGID: "1000"
      MEDIA_PATH: /media
      DOWNLOAD_PATH: /downloads
      POT_PROVIDER_URL: http://bgutil-provider:4416
      # Optional: ask Jellyfin to rescan after filing.
      # JELLYFIN_URL: https://jellyfin.example.test:8920
      # JELLYFIN_TOKEN: <API key>
      # Optional: a marker file on the library disk; nothing is filed while it
      # is missing. Create the file before setting this.
      # LIBRARY_SENTINEL: /media/.library-mounted
    volumes:
      - ./data:/app/data
      - ./library:/media
      - ./staging:/downloads
    # The heartbeat, yt-dlp's path reports and the yt-dlp and deno caches live
    # in /tmp, kept off the disk.
    tmpfs:
      - /tmp
    # The worker serves no HTTP, so this checks the age of its heartbeat file.
    # 600 s clears the longest gap between touches.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 600 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      - bgutil-provider

  # Mints the PO tokens YouTube requires for its full format list. Keep it on
  # the release of the image's bgutil plugin, named in the worker's Components
  # line: the plugin refuses another major and warns about any other mismatch.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
